                    tabSize: 4,

                    insertSpaces: true,

                    automaticClosingBrackets: "always",

                    autoClosingQuotes: "always",

                    quickSuggestions: {
                        other: true,
                        comments: false,
                        strings: false
                    },

                    acceptSuggestionOnEnter: "on",

                    acceptSuggestionOnCommitCharacter:
                        true,

                    tabCompletion: "on",

                    snippetSuggestions: "inline",

                    parameterHints: {
                        enabled: true
                    },

                    wordBasedSuggestions: "all",

                    bracketPairColorization: {
                        enabled: true
                    },

                    guides: {
                        bracketPairs: true,
                        indentation: true
                    },

                    scrollbar: {
                        verticalScrollbarSize: 10,
                        horizontalScrollbarSize: 10
                    },

                    suggest: {
                        showMethods: true,
                        showFunctions: true,
                        showConstructors: true,
                        showFields: true,
                        showVariables: true,
                        showClasses: true,
                        showStructs: true,
                        showInterfaces: true,
                        showModules: true,
                        showProperties: true,
                        showKeywords: true,
                        showValues: true,
                        showConstants: true,
                        showEnums: true,
                        showEnumMembers: true,
                        showOperators: true,
                        showUnits: true,
                        preview: true,
                        showStatusBar: true
                    }
                }
            );

        window.hypeEditor = editor;

        let autoClosingBlock = false;

        editor.onDidChangeModelContent(
            function (event) {

                if (autoClosingBlock)
                    return;

                for (const change of event.changes) {

                    if (!change.text.includes("\n"))
                        continue;

                    const position =
                        editor.getPosition();

                    if (!position)
                        continue;

                    const model =
                        editor.getModel();

                    if (!model)
                        continue;

                    const previousLineNumber =
                        position.lineNumber - 1;

                    if (previousLineNumber < 1)
                        continue;

                    const previousLine =
                        model
                            .getLineContent(
                                previousLineNumber
                            )
                            .trim();

                    const blockPattern =
                        /^(for\b.*\bdo|if\b.*\bthen|elseif\b.*\bthen|while\b.*\bdo|function\b.*|local\s+function\b.*|do)$/;

                    if (!blockPattern.test(previousLine))
                        continue;

                    const currentLine =
                        model.getLineContent(
                            position.lineNumber
                        );

                    if (currentLine.trim() !== "")
                        continue;

                    const indentationMatch =
                        model
                            .getLineContent(
                                previousLineNumber
                            )
                            .match(/^\s*/);

                    const indentation =
                        indentationMatch
                            ? indentationMatch[0]
                            : "";

                    const innerIndent =
                        indentation + "    ";

                    autoClosingBlock = true;

                    editor.executeEdits(
                        "hype-auto-end",
                        [
                            {
                                range: {
                                    startLineNumber:
                                        position.lineNumber,

                                    startColumn: 1,

                                    endLineNumber:
                                        position.lineNumber,

                                    endColumn: 1
                                },

                                text:
                                    innerIndent +
                                    "\n" +
                                    indentation +
                                    "end"
                            }
                        ]
                    );

                    editor.setPosition(
                        {
                            lineNumber:
                                position.lineNumber,

                            column:
                                innerIndent.length + 1
                        }
                    );

                    autoClosingBlock = false;

                    break;
                }
            }
        );

        window.getCode = function () {
            return editor.getValue();
        };

        window.setCode = function (code) {
            editor.setValue(code || "");
        };

        window.clearCode = function () {
            editor.setValue("");
        };

        window.focusEditor = function () {
            editor.focus();
        };

        window.insertText = function (text) {

            const selection =
                editor.getSelection();

            if (!selection)
                return;

            editor.executeEdits(
                "hype-insert",
                [
                    {
                        range: selection,
                        text: text,
                        forceMoveMarkers: true
                    }
                ]
            );

            editor.focus();
        };

        window.toggleMinimap = function () {

            const options =
                editor.getOption(
                    monaco.editor.EditorOption.minimap
                );

            const enabled =
                !options.enabled;

            editor.updateOptions({
                minimap: {
                    enabled: enabled
                }
            });

            return enabled;
        };

        window.setMinimap = function (enabled) {

            const value =
                Boolean(enabled);

            editor.updateOptions({
                minimap: {
                    enabled: value
                }
            });

            return value;
        };

        window.isMinimapEnabled = function () {

            return editor
                .getOption(
                    monaco.editor.EditorOption.minimap
                )
                .enabled;
        };

        window.getEditorValue = function () {
            return editor.getValue();
        };

        window.setEditorValue = function (value) {
            editor.setValue(value || "");
        };

        window.layoutEditor = function () {
            editor.layout();
        };

        window.addEventListener(
            "resize",
            function () {
                editor.layout();
            }
        );

    });

</script>

</body>
</html>
